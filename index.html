<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">

<meta name="viewport"
content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>RSAF AR - Stage 5D</title>


<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>


<style>

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:Arial,sans-serif;
  color:white;
}

#info{
  position:fixed;
  z-index:10;
  left:12px;
  right:12px;
  bottom:12px;
  padding:15px;
  border-radius:16px;
  background:rgba(8,21,34,.92);
  text-align:center;
  pointer-events:none;
}

h2{
  margin:0 0 8px;
  font-size:20px;
}

#status{
  font-size:14px;
  color:#d8e4ec;
}

#error{
  margin-top:8px;
  color:#ffb4b4;
  font-size:13px;
}

</style>

</head>


<body>


<div id="info">

<h2>
RSAF AR — Stage 5D
</h2>

<div id="status">
Loading...
</div>

<div id="error"></div>

</div>


<script type="module">


import * as THREE from 'three';


import { ARButton }
from 'three/addons/webxr/ARButton.js';


import { GLTFLoader }
from 'three/addons/loaders/GLTFLoader.js';


/*
HTML
*/

const status =
document.getElementById('status');

const error =
document.getElementById('error');


/*
TEMPORARY AIRCRAFT
*/

const MODEL_URL =
'https://raw.githubusercontent.com/amvlab/aircraft-models/main/models/A320.glb';


/*
SCENE
*/

const scene =
new THREE.Scene();


/*
CAMERA
*/

const camera =
new THREE.PerspectiveCamera(

70,

window.innerWidth /
window.innerHeight,

0.01,

100

);


/*
LIGHTING
*/

const hemisphere =
new THREE.HemisphereLight(

0xffffff,
0xbbbbff,
2

);

scene.add(
hemisphere
);


const directional =
new THREE.DirectionalLight(

0xffffff,
2

);

directional.position.set(
5,
10,
5
);

scene.add(
directional
);


/*
RENDERER
*/

const renderer =
new THREE.WebGLRenderer({

antialias:true,

alpha:true

});


renderer.setPixelRatio(

Math.min(
window.devicePixelRatio,
2
)

);


renderer.setSize(

window.innerWidth,
window.innerHeight

);


renderer.xr.enabled=true;


document.body.appendChild(

renderer.domElement

);


/*
AR BUTTON

Only used to START AR.
*/

const arButton =
ARButton.createButton(

renderer,

{

requiredFeatures:[
'hit-test'
]

}

);


document.body.appendChild(
arButton
);


arButton.style.position=
'fixed';

arButton.style.bottom=
'110px';

arButton.style.left=
'50%';

arButton.style.transform=
'translateX(-50%)';

arButton.style.width=
'220px';

arButton.style.height=
'55px';

arButton.style.fontSize=
'18px';

arButton.style.fontWeight=
'bold';


/*
GREEN FLOOR RETICLE
*/

const reticle =
new THREE.Mesh(

new THREE.RingGeometry(

0.12,
0.18,
32

),

new THREE.MeshBasicMaterial({

color:0x00ff00

})

);


reticle.rotation.x=
-Math.PI/2;


reticle.matrixAutoUpdate=
false;


reticle.visible=
false;


scene.add(
reticle
);


/*
WEBXR
*/

let hitTestSource =
null;

let viewerSpace =
null;

let localSpace =
null;

let xrSession =
null;


/*
AIRCRAFT TEMPLATE
*/

let aircraftTemplate =
null;


/*
TWO AIRCRAFT
*/

let aircraft1 =
null;

let aircraft2 =
null;


/*
WHICH AIRCRAFT IS NEXT?

1 = first
2 = second
3 = finished
*/

let nextAircraft =
1;


/*
LOAD MODEL
*/

const loader =
new GLTFLoader();


status.textContent =
'Loading temporary aircraft...';


loader.load(

MODEL_URL,


function(gltf){

aircraftTemplate =
gltf.scene;


aircraftTemplate.traverse(

function(object){

if(object.isMesh){

object.castShadow=true;

object.receiveShadow=true;

}

});


status.textContent =
'✓ AIRCRAFT READY — tap START AR.';

},


function(progress){

if(progress.total){

const percent =
Math.round(

(progress.loaded /
progress.total) *
100

);


status.textContent =
'Loading aircraft... ' +
percent +
'%';

}

},


function(err){

status.textContent =
'AIRCRAFT LOAD FAILED';

error.textContent =
'Aircraft model could not be loaded.';

console.error(
err
);

}

);


/*
AR START
*/

renderer.xr.addEventListener(

'sessionstart',

async function(){

xrSession =
renderer.xr.getSession();


status.textContent =
'AR started — scan the floor.';


try{

viewerSpace =
await xrSession.requestReferenceSpace(
'viewer'
);


localSpace =
await xrSession.requestReferenceSpace(
'local'
);


hitTestSource =
await xrSession.requestHitTestSource({

space:viewerSpace

});


/*
IMPORTANT:

A tap on the AR screen will
generate the WebXR SELECT event.
*/

xrSession.addEventListener(

'select',

onARSelect

);


status.textContent =
'Move phone until the green circle appears.';


}catch(e){

status.textContent =
'AR SETUP FAILED';

error.textContent =
e.message;

console.error(
e
);

}

});


/*
AR SCREEN TAP
*/

function onARSelect(){

/*
No floor detected yet.
*/

if(!reticle.visible){

status.textContent =
'Keep scanning until the green circle appears.';

return;

}


/*
Aircraft model not ready.
*/

if(!aircraftTemplate){

status.textContent =
'Aircraft is still loading.';

return;

}


/*
FIRST TAP
*/

if(nextAircraft === 1){

aircraft1 =
aircraftTemplate.clone(true);


aircraft1.position.setFromMatrixPosition(
reticle.matrix
);


aircraft1.scale.set(
1,
1,
1
);


scene.add(
aircraft1
);


nextAircraft =
2;


status.textContent =
'✓ AIRCRAFT 1 PLACED — move to another position and TAP THE SCREEN FOR AIRCRAFT 2.';

return;

}


/*
SECOND TAP
*/

if(nextAircraft === 2){

aircraft2 =
aircraftTemplate.clone(true);


aircraft2.position.setFromMatrixPosition(
reticle.matrix
);


aircraft2.scale.set(
1,
1,
1
);


/*
Slight rotation difference
*/

aircraft2.rotation.y =
THREE.MathUtils.degToRad(25);


scene.add(
aircraft2
);


nextAircraft =
3;


reticle.visible =
false;


status.textContent =
'✓ TWO AIRCRAFT PLACED — MOVE AROUND THEM.';

return;

}

}


/*
AR END
*/

renderer.xr.addEventListener(

'sessionend',

function(){

hitTestSource =
null;

viewerSpace =
null;

localSpace =
null;

xrSession =
null;

reticle.visible =
false;

nextAircraft =
1;

status.textContent =
'AR ended.';

}

);


/*
XR RENDER LOOP
*/

renderer.setAnimationLoop(

function(
time,
frame
){

if(

frame &&
hitTestSource &&
localSpace

){

const results =
frame.getHitTestResults(

hitTestSource

);


if(results.length > 0){

const hit =
results[0];


const pose =
hit.getPose(

localSpace

);


if(pose){

reticle.visible =
true;


reticle.matrix.fromArray(

pose.transform.matrix

);


if(nextAircraft === 1){

status.textContent =
'✓ FLOOR FOUND — TAP SCREEN TO PLACE AIRCRAFT 1.';

}else if(nextAircraft === 2){

status.textContent =
'✓ FLOOR FOUND — MOVE TO SECOND POSITION AND TAP SCREEN.';

}

}

}else{

reticle.visible =
false;


if(nextAircraft < 3){

status.textContent =
'Scanning for floor...';

}

}

}


renderer.render(

scene,
camera

);

});


/*
CHECK AR
*/

async function checkAR(){

try{

if(!navigator.xr){

throw new Error(
'WebXR is unavailable.'
);

}


const supported =
await navigator.xr.isSessionSupported(

'immersive-ar'

);


if(!supported){

throw new Error(
'Immersive AR is not supported.'
);

}


status.textContent =
'✓ AR READY — tap START AR.';


}catch(e){

status.textContent =
'AR CHECK FAILED';

error.textContent =
e.message;

}

}


checkAR();


/*
RESIZE
*/

window.addEventListener(

'resize',

function(){

camera.aspect =
window.innerWidth /
window.innerHeight;


camera.updateProjectionMatrix();


renderer.setSize(

window.innerWidth,
window.innerHeight

);

});


</script>

</body>

</html>
