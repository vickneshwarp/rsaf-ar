<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">

<meta name="viewport"
content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>RSAF AR - Stage 5C</title>

<style>

html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
background:#000;
font-family:Arial,sans-serif;
color:white;
}

#info{
position:fixed;
z-index:10;
left:12px;
right:12px;
bottom:12px;
padding:15px;
border-radius:16px;
background:rgba(8,21,34,.92);
text-align:center;
}

h2{
margin:0 0 8px;
font-size:20px;
}

#status{
font-size:14px;
color:#d8e4ec;
}

#error{
margin-top:8px;
color:#ffb4b4;
font-size:13px;
}

#place{
display:none;
margin-top:10px;
padding:14px 22px;
border:0;
border-radius:10px;
font-size:16px;
font-weight:bold;
}

</style>

</head>

<body>


<div id="info">

<h2>RSAF AR — Stage 5C</h2>

<div id="status">
Starting...
</div>

<button id="place">
PLACE AIRCRAFT
</button>

<div id="error"></div>

</div>


<script type="module">


import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';


import { ARButton } from
'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/webxr/ARButton.js';


import { GLTFLoader } from
'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js';


const status =
document.getElementById('status');

const error =
document.getElementById('error');

const placeButton =
document.getElementById('place');


/*
TEMPORARY AIRCRAFT
*/

const MODEL_URL =
'https://raw.githubusercontent.com/amvlab/aircraft-models/main/models/A320.glb';


/*
SCENE
*/

const scene =
new THREE.Scene();


/*
CAMERA
*/

const camera =
new THREE.PerspectiveCamera(
70,
window.innerWidth /
window.innerHeight,
0.01,
100
);


/*
LIGHT
*/

const light =
new THREE.HemisphereLight(
0xffffff,
0xbbbbff,
2
);

scene.add(light);


const directionalLight =
new THREE.DirectionalLight(
0xffffff,
2
);

directionalLight.position.set(
5,
10,
5
);

scene.add(directionalLight);


/*
RENDERER
*/

const renderer =
new THREE.WebGLRenderer({

antialias:true,

alpha:true

});

renderer.setPixelRatio(
window.devicePixelRatio
);

renderer.setSize(
window.innerWidth,
window.innerHeight
);

renderer.xr.enabled=true;

document.body.appendChild(
renderer.domElement
);


/*
AR BUTTON
*/

const arButton =
ARButton.createButton(

renderer,

{

requiredFeatures:[
'hit-test'
]

}

);

document.body.appendChild(
arButton
);


arButton.style.position=
'fixed';

arButton.style.bottom=
'110px';

arButton.style.left=
'50%';

arButton.style.transform=
'translateX(-50%)';

arButton.style.width=
'220px';

arButton.style.height=
'55px';

arButton.style.fontSize=
'18px';

arButton.style.fontWeight=
'bold';


/*
RETICLE
*/

const reticle =
new THREE.Mesh(

new THREE.RingGeometry(
0.12,
0.18,
32
),

new THREE.MeshBasicMaterial({
color:0x00ff00
})

);

reticle.rotation.x=
-Math.PI/2;

reticle.matrixAutoUpdate=false;

reticle.visible=false;

scene.add(reticle);


/*
WEBXR VARIABLES
*/

let hitTestSource=null;

let viewerSpace=null;

let localSpace=null;


/*
AIRCRAFT
*/

let aircraftTemplate=null;

let aircraft=null;


/*
LOAD AIRCRAFT
*/

const loader =
new GLTFLoader();


status.textContent=
'Loading aircraft...';


loader.load(

MODEL_URL,

function(gltf){

aircraftTemplate=
gltf.scene;


aircraftTemplate.traverse(
function(object){

if(object.isMesh){

object.castShadow=true;

object.receiveShadow=true;

}

});


status.textContent=
'✓ AIRCRAFT READY — tap START AR.';

},


undefined,


function(err){

error.textContent=
'Aircraft failed to load.';

console.error(err);

}

);


/*
AR START
*/

renderer.xr.addEventListener(
'sessionstart',
async function(){

status.textContent=
'AR started — scan the floor.';


const session =
renderer.xr.getSession();


try{

viewerSpace =
await session.requestReferenceSpace(
'viewer'
);


localSpace =
await session.requestReferenceSpace(
'local'
);


hitTestSource =
await session.requestHitTestSource({

space:viewerSpace

});


placeButton.style.display=
'inline-block';


status.textContent=
'Move phone until green circle appears.';


}catch(e){

error.textContent=
'Hit test error: '+
e.message;

}

});


/*
AR END
*/

renderer.xr.addEventListener(
'sessionend',
function(){

hitTestSource=null;

viewerSpace=null;

localSpace=null;

reticle.visible=false;

placeButton.style.display=
'none';

});


/*
PLACE BUTTON
*/

placeButton.addEventListener(
'click',
function(){

placeAircraft();

});


/*
PLACE AIRCRAFT
*/

function placeAircraft(){

if(!reticle.visible){

status.textContent=
'Please find the floor first.';

return;

}


if(!aircraftTemplate){

status.textContent=
'Aircraft is still loading.';

return;

}


/*
Remove previous aircraft
*/

if(aircraft){

scene.remove(
aircraft
);

}


/*
Clone aircraft
*/

aircraft =
aircraftTemplate.clone(true);


/*
Place at reticle
*/

aircraft.position.setFromMatrixPosition(
reticle.matrix
);


/*
Temporary size

We will calibrate this later
to the actual aircraft size.
*/

aircraft.scale.set(
1,
1,
1
);


/*
Add aircraft
*/

scene.add(
aircraft
);


/*
Hide reticle
*/

reticle.visible=false;


placeButton.style.display=
'none';


status.textContent=
'✓ AIRCRAFT PLACED';

}


/*
XR LOOP
*/

renderer.setAnimationLoop(
function(
time,
frame
){

if(frame && hitTestSource && localSpace){

const results =
frame.getHitTestResults(
hitTestSource
);


if(results.length>0){

const hit =
results[0];


const pose =
hit.getPose(
localSpace
);


if(pose){

reticle.visible=true;


reticle.matrix.fromArray(
pose.transform.matrix
);


if(!aircraft){

status.textContent=
'✓ FLOOR DETECTED — tap PLACE AIRCRAFT.';

}

}

}else{

reticle.visible=false;


if(!aircraft){

status.textContent=
'Scanning for floor...';

}

}

}


renderer.render(
scene,
camera
);

});


/*
WEBXR CHECK
*/

async function checkAR(){

try{

if(!navigator.xr){

throw new Error(
'WebXR unavailable.'
);

}


const supported =
await navigator.xr.isSessionSupported(
'immersive-ar'
);


if(!supported){

throw new Error(
'Immersive AR not supported.'
);

}


status.textContent=
'✓ AR READY — tap START AR.';


}catch(e){

status.textContent=
'AR CHECK FAILED';

error.textContent=
e.message;

}

}


checkAR();


/*
RESIZE
*/

window.addEventListener(
'resize',
function(){

camera.aspect=
window.innerWidth/
window.innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(
window.innerWidth,
window.innerHeight
);

});


</script>

</body>

</html>
