<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width,initial-scale=1,viewport-fit=cover">

  <title>RSAF AR - Stage 3</title>

  <style>
    *{box-sizing:border-box}

    html,body{
      margin:0;
      width:100%;
      height:100%;
      overflow:hidden;
      background:#000;
      font-family:Arial,sans-serif;
      color:#fff
    }

    #panel{
      position:fixed;
      z-index:10;
      left:16px;
      right:16px;
      bottom:20px;
      padding:18px;
      background:rgba(8,21,34,.9);
      border-radius:16px;
      text-align:center
    }

    h2{
      margin:0 0 8px
    }

    p{
      margin:8px 0;
      color:#d8e4ec
    }

    button{
      margin-top:8px;
      padding:14px 24px;
      border:0;
      border-radius:12px;
      font-size:17px;
      font-weight:700
    }

    #error{
      color:#ffb4b4
    }
  </style>

  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
  </script>

</head>

<body>

  <model-viewer
    id="arModel"

    src="https://raw.githubusercontent.com/amvlab/aircraft-models/main/models/A320.glb"

    ar
    ar-modes="webxr scene-viewer quick-look"

    camera-controls

    shadow-intensity="1"
    exposure="1"

    alt="Temporary aircraft model">

  </model-viewer>


  <div id="panel">

    <h2>RSAF AR — Stage 3</h2>

    <p id="status">
      Press START AR.
    </p>

    <button id="start">
      START AR
    </button>

    <p id="error"></p>

  </div>


  <script>

    const model =
      document.getElementById('arModel');

    const status =
      document.getElementById('status');

    const error =
      document.getElementById('error');

    const button =
      document.getElementById('start');


    // Check whether the browser supports AR

    async function checkAR(){

      try{

        if (!navigator.xr){

          throw new Error(
            'WebXR is not available in this browser.'
          );

        }

        const supported =
          await navigator.xr.isSessionSupported(
            'immersive-ar'
          );

        if(!supported){

          throw new Error(
            'Immersive AR is not supported on this device/browser.'
          );

        }

        status.textContent =
          '✓ AR SUPPORT DETECTED';

        button.style.display =
          'block';

      }catch(e){

        status.textContent =
          'AR SUPPORT CHECK FAILED';

        error.textContent =
          e.message;

      }

    }


    button.addEventListener('click', async ()=>{

      error.textContent = '';

      status.textContent =
        'Opening AR...';

      try{

        await model.activateAR();

        status.textContent =
          '✓ AR STARTED';

      }catch(e){

        status.textContent =
          'AR FAILED';

        error.textContent =
          e.name + ': ' + e.message;

      }

    });


    model.addEventListener('load', ()=>{

      status.textContent =
        '✓ AIRCRAFT MODEL READY';

    });


    checkAR();

  </script>

</body>
</html>
