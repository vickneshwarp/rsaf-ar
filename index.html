<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>RSAF AR</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Arial, sans-serif;
      background: #081522;
      color: white;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      width: min(520px, 100%);
      padding: 32px 24px;
      text-align: center;
      background: #12283a;
      border-radius: 20px;
    }
    h1 { margin: 0 0 12px; }
    p { line-height: 1.5; color: #d8e4ec; }
    button {
      margin-top: 12px;
      padding: 14px 26px;
      border: 0;
      border-radius: 12px;
      font-size: 18px;
      font-weight: 700;
    }
    #status {
      margin-top: 18px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>RSAF AR</h1>
    <p>Stage 1 installation test</p>
    <p>If you can see this page, the new RSAF AR website is working.</p>
    <button onclick="document.getElementById('status').textContent='✓ WEBSITE TEST PASSED'">
      TEST WEBSITE
    </button>
    <div id="status"></div>
  </main>
</body>
</html>
