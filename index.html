<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">

<meta name="viewport"
content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>RSAF AR - Stage 5C Fixed</title>


<!-- THREE.JS IMPORT MAP -->

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>


<style>

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:Arial,sans-serif;
  color:white;
}

#info{
  position:fixed;
  z-index:10;
  left:12px;
  right:12px;
  bottom:12px;
  padding:15px;
  border-radius:16px;
  background:rgba(8,21,34,.92);
  text-align:center;
}

h2{
  margin:0 0 8px;
  font-size:20px;
}

#status{
  font-size:14px;
  color:#d8e4ec;
}

#error{
  margin-top:8px;
  color:#ffb4b4;
  font-size:13px;
}

#place{
  display:none;
  margin-top:10px;
  padding:14px 22px;
  border:0;
  border-radius:10px;
  font-size:16px;
  font-weight:bold;
}

</style>

</head>


<body>


<div id="info">

<h2>RSAF AR — Stage 5C</h2>

<div id="status">
Loading...
</div>

<button id="place">
PLACE AIRCRAFT
</button>

<div id="error"></div>

</div>


<script type="module">

import * as THREE from 'three';

import { ARButton }
from 'three/addons/webxr/ARButton.js';

import { GLTFLoader }
from 'three/addons/loaders/GLTFLoader.js';


/*
HTML
*/

const status =
document.getElementById('status');

const error =
document.getElementById('error');

const placeButton =
document.getElementById('place');


/*
TEMPORARY AIRCRAFT MODEL
*/

const MODEL_URL =
'https://raw.githubusercontent.com/amvlab/aircraft-models/main/models/A320.glb';


/*
SCENE
*/

const scene =
new THREE.Scene();


/*
CAMERA
*/

const camera =
new THREE.PerspectiveCamera(
70,
window.innerWidth / window.innerHeight,
0.01,
100
);


/*
LIGHTING
*/

const hemisphere =
new THREE.HemisphereLight(
0xffffff,
0xbbbbff,
2
);

scene.add(hemisphere);


const directional =
new THREE.DirectionalLight(
0xffffff,
2
);

directional.position.set(
5,
10,
5
);

scene.add(directional);


/*
RENDERER
*/

const renderer =
new THREE.WebGLRenderer({

antialias:true,

alpha:true

});


renderer.setPixelRatio(
Math.min(window.devicePixelRatio,2)
);

renderer.setSize(
window.innerWidth,
window.innerHeight
);

renderer.xr.enabled=true;

document.body.appendChild(
renderer.domElement
);


/*
AR BUTTON
*/

const arButton =
ARButton.createButton(

renderer,

{
requiredFeatures:[
'hit-test'
]
}

);

document.body.appendChild(
arButton
);


arButton.style.position=
'fixed';

arButton.style.bottom=
'110px';

arButton.style.left=
'50%';

arButton.style.transform=
'translateX(-50%)';

arButton.style.width=
'220px';

arButton.style.height=
'55px';

arButton.style.fontSize=
'18px';

arButton.style.fontWeight=
'bold';


/*
RETICLE
*/

const reticle =
new THREE.Mesh(

new THREE.RingGeometry(
0.12,
0.18,
32
),

new THREE.MeshBasicMaterial({
color:0x00ff00
})

);

reticle.rotation.x=
-Math.PI/2;

reticle.matrixAutoUpdate=false;

reticle.visible=false;

scene.add(reticle);


/*
WEBXR
*/

let hitTestSource=null;

let viewerSpace=null;

let localSpace=null;


/*
AIRCRAFT
*/

let aircraftTemplate=null;

let aircraft=null;


/*
LOAD AIRCRAFT
*/

status.textContent=
'Loading temporary aircraft...';


const loader =
new GLTFLoader();


loader.load(

MODEL_URL,

function(gltf){

aircraftTemplate =
gltf.scene;


aircraftTemplate.traverse(
function(object){

if(object.isMesh){

object.castShadow=true;

object.receiveShadow=true;

}

});


status.textContent=
'✓ AIRCRAFT READY — tap START AR.';

},


function(progress){

if(progress.total){

const percent =
Math.round(
(progress.loaded / progress.total) * 100
);

status.textContent=
'Loading aircraft... ' +
percent +
'%';

}

},


function(err){

status.textContent=
'AIRCRAFT LOAD FAILED';

error.textContent=
'The temporary aircraft could not be loaded.';

console.error(
'GLTF ERROR:',
err
);

}

);


/*
AR SESSION START
*/

renderer.xr.addEventListener(
'sessionstart',
async function(){

status.textContent=
'AR started — scan the floor.';


const session =
renderer.xr.getSession();


try{

viewerSpace =
await session.requestReferenceSpace(
'viewer'
);


localSpace =
await session.requestReferenceSpace(
'local'
);


hitTestSource =
await session.requestHitTestSource({

space:viewerSpace

});


placeButton.style.display=
'inline-block';


status.textContent=
'Move phone until the green circle appears.';


}catch(e){

error.textContent=
'Hit-test error: ' +
e.message;

}

});


/*
AR SESSION END
*/

renderer.xr.addEventListener(
'sessionend',
function(){

hitTestSource=null;

viewerSpace=null;

localSpace=null;

reticle.visible=false;

placeButton.style.display=
'none';

});


/*
PLACE BUTTON
*/

placeButton.addEventListener(
'click',
function(){

if(!reticle.visible){

status.textContent=
'Please find the floor first.';

return;

}


if(!aircraftTemplate){

status.textContent=
'Aircraft model is not ready yet.';

return;

}


/*
Remove old aircraft
*/

if(aircraft){

scene.remove(
aircraft
);

}


/*
Clone model
*/

aircraft =
aircraftTemplate.clone(true);


/*
Place model
*/

aircraft.position.setFromMatrixPosition(
reticle.matrix
);


/*
Temporary scale

We will make this
true life-size later.
*/

aircraft.scale.set(
1,
1,
1
);


/*
Add to scene
*/

scene.add(
aircraft
);


/*
Hide reticle
*/

reticle.visible=false;

placeButton.style.display=
'none';


status.textContent=
'✓ AIRCRAFT PLACED';

});


/*
XR RENDER LOOP
*/

renderer.setAnimationLoop(
function(time,frame){

if(
frame &&
hitTestSource &&
localSpace
){

const results =
frame.getHitTestResults(
hitTestSource
);


if(results.length>0){

const hit =
results[0];


const pose =
hit.getPose(
localSpace
);


if(pose){

reticle.visible=true;

reticle.matrix.fromArray(
pose.transform.matrix
);


if(!aircraft){

status.textContent=
'✓ FLOOR DETECTED — tap PLACE AIRCRAFT.';

}

}

}else{

reticle.visible=false;


if(!aircraft){

status.textContent=
'Scanning for floor...';

}

}

}


renderer.render(
scene,
camera
);

});


/*
CHECK AR
*/

async function checkAR(){

try{

if(!navigator.xr){

throw new Error(
'WebXR is unavailable.'
);

}


const supported =
await navigator.xr.isSessionSupported(
'immersive-ar'
);


if(!supported){

throw new Error(
'Immersive AR is not supported.'
);

}


status.textContent=
'✓ AR READY — tap START AR.';


}catch(e){

status.textContent=
'AR CHECK FAILED';

error.textContent=
e.message;

}

}


checkAR();


/*
RESIZE
*/

window.addEventListener(
'resize',
function(){

camera.aspect=
window.innerWidth /
window.innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(
window.innerWidth,
window.innerHeight
);

});


/*
CATCH JAVASCRIPT ERRORS
*/

window.addEventListener(
'error',
function(event){

console.error(event.error);

});

</script>

</body>

</html>
