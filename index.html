<!doctype html>
<html lang="en">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover">

  <title>RSAF AR - Stage 5A Test</title>

  <style>

    html,
    body {

      margin: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: #000;

      font-family: Arial, sans-serif;

      color: white;

    }

    #info {

      position: fixed;

      z-index: 10;

      left: 12px;
      right: 12px;

      bottom: 12px;

      padding: 15px;

      border-radius: 16px;

      background: rgba(8,21,34,.92);

      text-align: center;

    }

    h2 {

      margin: 0 0 8px;

      font-size: 20px;

    }

    #status {

      font-size: 14px;

      color: #d8e4ec;

    }

    #error {

      margin-top: 8px;

      color: #ffb4b4;

      font-size: 13px;

    }

    button {

      padding: 14px 22px;

      border: 0;

      border-radius: 10px;

      font-size: 17px;

      font-weight: bold;

    }

  </style>

</head>


<body>


  <div id="info">

    <h2>

      RSAF AR — Stage 5A

    </h2>

    <div id="status">

      Loading AR test...

    </div>

    <div id="error"></div>

  </div>


  <script type="module">


    import * as THREE from
      'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';


    import { ARButton } from
      'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/webxr/ARButton.js';


    const status =
      document.getElementById('status');


    const error =
      document.getElementById('error');


    /*
      Scene
    */

    const scene =
      new THREE.Scene();


    /*
      Camera
    */

    const camera =
      new THREE.PerspectiveCamera(
        70,
        window.innerWidth /
        window.innerHeight,
        0.01,
        100
      );


    /*
      Light
    */

    const light =
      new THREE.HemisphereLight(
        0xffffff,
        0xbbbbff,
        2
      );


    scene.add(light);


    /*
      Renderer
    */

    const renderer =
      new THREE.WebGLRenderer({

        antialias: true,

        alpha: true

      });


    renderer.setPixelRatio(
      window.devicePixelRatio
    );


    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );


    renderer.xr.enabled = true;


    document.body.appendChild(
      renderer.domElement
    );


    /*
      Official Three.js AR button
    */

    const arButton =
      ARButton.createButton(

        renderer,

        {

          requiredFeatures: [
            'hit-test'
          ]

        }

      );


    document.body.appendChild(
      arButton
    );


    /*
      Button appearance
    */

    arButton.style.position =
      'fixed';

    arButton.style.bottom =
      '100px';

    arButton.style.left =
      '50%';

    arButton.style.transform =
      'translateX(-50%)';

    arButton.style.width =
      '220px';

    arButton.style.height =
      '55px';

    arButton.style.fontSize =
      '18px';

    arButton.style.fontWeight =
      'bold';


    /*
      Check WebXR
    */

    async function checkAR(){

      try{

        if(!navigator.xr){

          throw new Error(
            'navigator.xr is not available.'
          );

        }


        const supported =
          await navigator.xr.isSessionSupported(
            'immersive-ar'
          );


        if(!supported){

          throw new Error(
            'immersive-ar is not supported.'
          );

        }


        status.textContent =
          '✓ WebXR AR detected. Tap START AR.';


      }catch(e){

        status.textContent =
          'AR CHECK FAILED';

        error.textContent =
          e.message;

      }

    }


    /*
      Detect AR session
    */

    renderer.xr.addEventListener(
      'sessionstart',
      function(){

        status.textContent =
          '✓ AR SESSION STARTED';

        error.textContent =
          '';

      }
    );


    /*
      Detect AR session ending
    */

    renderer.xr.addEventListener(
      'sessionend',
      function(){

        status.textContent =
          'AR session ended.';

      }
    );


    /*
      Catch errors
    */

    window.addEventListener(
      'unhandledrejection',
      function(event){

        error.textContent =
          'ERROR: ' +
          event.reason;

        console.error(
          event.reason
        );

      }
    );


    /*
      Animation loop
    */

    renderer.setAnimationLoop(
      function(){

        renderer.render(
          scene,
          camera
        );

      }
    );


    /*
      Resize
    */

    window.addEventListener(
      'resize',
      function(){

        if(
          renderer.xr.isPresenting
        ){

          return;

        }


        camera.aspect =
          window.innerWidth /
          window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
          window.innerWidth,
          window.innerHeight
        );

      }
    );


    checkAR();

  </script>


</body>

</html>
