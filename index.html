<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">

<meta name="viewport"
content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>RSAF AR - Stage 5B</title>

<style>

html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
background:#000;
font-family:Arial,sans-serif;
color:white;
}

#info{
position:fixed;
z-index:10;
left:12px;
right:12px;
bottom:12px;
padding:15px;
border-radius:16px;
background:rgba(8,21,34,.92);
text-align:center;
}

h2{
margin:0 0 8px;
font-size:20px;
}

#status{
font-size:14px;
color:#d8e4ec;
}

#error{
margin-top:8px;
color:#ffb4b4;
font-size:13px;
}

</style>

</head>

<body>

<div id="info">

<h2>RSAF AR — Stage 5B</h2>

<div id="status">
Starting...
</div>

<div id="error"></div>

</div>


<script type="module">


import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';


import { ARButton } from
'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/webxr/ARButton.js';


const status =
document.getElementById('status');

const error =
document.getElementById('error');


/*
SCENE
*/

const scene =
new THREE.Scene();


/*
CAMERA
*/

const camera =
new THREE.PerspectiveCamera(
70,
window.innerWidth /
window.innerHeight,
0.01,
100
);


/*
LIGHT
*/

const light =
new THREE.HemisphereLight(
0xffffff,
0xbbbbff,
2
);

scene.add(light);


/*
RENDERER
*/

const renderer =
new THREE.WebGLRenderer({

antialias:true,

alpha:true

});


renderer.setPixelRatio(
window.devicePixelRatio
);

renderer.setSize(
window.innerWidth,
window.innerHeight
);

renderer.xr.enabled=true;

document.body.appendChild(
renderer.domElement
);


/*
AR BUTTON
*/

const arButton =
ARButton.createButton(

renderer,

{

requiredFeatures:[
'hit-test'
]

}

);

document.body.appendChild(
arButton
);


/*
BUTTON POSITION
*/

arButton.style.position=
'fixed';

arButton.style.bottom=
'100px';

arButton.style.left=
'50%';

arButton.style.transform=
'translateX(-50%)';

arButton.style.width=
'220px';

arButton.style.height=
'55px';

arButton.style.fontSize=
'18px';

arButton.style.fontWeight=
'bold';


/*
RETICLE
*/

const reticle =
new THREE.Mesh(

new THREE.RingGeometry(
0.12,
0.18,
32
),

new THREE.MeshBasicMaterial({
color:0x00ff00
})

);


/*
Lay the ring flat
*/

reticle.rotation.x=
-Math.PI/2;


/*
Do not automatically
update its position
*/

reticle.matrixAutoUpdate=false;

reticle.visible=false;

scene.add(reticle);


/*
WEBXR VARIABLES
*/

let hitTestSource=null;

let viewerSpace=null;

let localSpace=null;


/*
AR SESSION START
*/

renderer.xr.addEventListener(
'sessionstart',
async function(){

status.textContent=
'AR started — move phone slowly to scan the floor.';


const session =
renderer.xr.getSession();


try{


/*
Viewer reference space
*/

viewerSpace =
await session.requestReferenceSpace(
'viewer'
);


/*
Local reference space
*/

localSpace =
await session.requestReferenceSpace(
'local'
);


/*
Request hit test
*/

hitTestSource =
await session.requestHitTestSource({

space:viewerSpace

});


status.textContent=
'Move the phone slowly until the green circle appears.';


}catch(e){

error.textContent=
'Hit test error: '+
e.message;

}

});


/*
AR SESSION END
*/

renderer.xr.addEventListener(
'sessionend',
function(){

hitTestSource=null;

viewerSpace=null;

localSpace=null;

reticle.visible=false;

status.textContent=
'AR ended.';

});


/*
XR RENDER LOOP
*/

renderer.setAnimationLoop(
function(
time,
frame
){

if(frame && hitTestSource && localSpace){

const hitTestResults =
frame.getHitTestResults(
hitTestSource
);


if(hitTestResults.length>0){

const hit =
hitTestResults[0];


const pose =
hit.getPose(
localSpace
);


if(pose){

reticle.visible=true;


reticle.matrix.fromArray(
pose.transform.matrix
);


status.textContent=
'✓ FLOOR DETECTED — green circle ready.';

}

}else{

reticle.visible=false;

status.textContent=
'Scanning for floor...';

}

}


renderer.render(
scene,
camera
);

});


/*
WEBXR CHECK
*/

async function checkAR(){

try{

if(!navigator.xr){

throw new Error(
'WebXR unavailable.'
);

}


const supported =
await navigator.xr.isSessionSupported(
'immersive-ar'
);


if(!supported){

throw new Error(
'Immersive AR not supported.'
);

}


status.textContent=
'✓ AR READY — tap START AR.';


}catch(e){

status.textContent=
'AR CHECK FAILED';

error.textContent=
e.message;

}

}


checkAR();


/*
RESIZE
*/

window.addEventListener(
'resize',
function(){

camera.aspect=
window.innerWidth/
window.innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(
window.innerWidth,
window.innerHeight
);

});


</script>

</body>

</html>
