<!doctype html>
<html lang="en">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover">

  <title>RSAF AR - Stage 5</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
      color: white;
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    #menu {

      position: fixed;

      z-index: 20;

      left: 12px;
      right: 12px;
      bottom: 12px;

      padding: 14px;

      background: rgba(8, 21, 34, 0.94);

      border-radius: 18px;

      text-align: center;
    }

    h2 {

      margin: 0 0 6px;

      font-size: 20px;
    }

    #status {

      margin: 6px 0 10px;

      font-size: 14px;

      color: #d8e4ec;
    }

    button {

      margin: 4px;

      padding: 11px 14px;

      border: 0;

      border-radius: 10px;

      font-size: 14px;

      font-weight: bold;

      background: white;

      color: #071522;
    }

    button:disabled {

      opacity: 0.4;
    }

    #start {

      font-size: 17px;

      padding: 14px 24px;
    }

    #controls {

      display: none;
    }

    #aircraftButtons {

      margin-bottom: 5px;
    }

    #selected {

      margin: 5px 0;

      font-size: 13px;

      color: #8fd3ff;
    }

    #photoExit {

      display: none;

      position: fixed;

      z-index: 30;

      top: 14px;

      right: 14px;

      padding: 10px 14px;

      border-radius: 10px;

      background: rgba(8,21,34,.9);

      color: white;

      border: 1px solid rgba(255,255,255,.3);
    }

    #error {

      color: #ffb4b4;

      font-size: 13px;

      margin-top: 6px;
    }

    #reticleInfo {

      display: none;

      position: fixed;

      z-index: 10;

      top: 14px;

      left: 50%;

      transform: translateX(-50%);

      padding: 9px 14px;

      border-radius: 12px;

      background: rgba(8,21,34,.85);

      font-size: 13px;

      text-align: center;
    }

  </style>

</head>


<body>


  <div id="reticleInfo">

    Move the phone until the floor is detected.<br>
    Then tap the screen to place the aircraft.

  </div>


  <button id="photoExit">

    EXIT PHOTO MODE

  </button>


  <div id="menu">

    <h2>

      RSAF AR — Stage 5

    </h2>


    <div id="status">

      Checking AR support...

    </div>


    <button id="start">

      START AR

    </button>


    <div id="controls">


      <div id="aircraftButtons">

        <button id="aircraft1">

          PLACE AIRCRAFT 1

        </button>

        <button id="aircraft2">

          PLACE AIRCRAFT 2

        </button>

        <button id="aircraft3">

          PLACE AIRCRAFT 3

        </button>

      </div>


      <div id="selected">

        Selected: Aircraft 1

      </div>


      <div>

        <button id="rotateLeft">

          ↶ ROTATE

        </button>

        <button id="rotateRight">

          ROTATE ↷

        </button>

      </div>


      <div>

        <button id="smaller">

          − SMALLER

        </button>

        <button id="larger">

          LARGER +

        </button>

      </div>


      <div>

        <button id="reset">

          RESET SELECTED

        </button>

        <button id="photoMode">

          📸 PHOTO MODE

        </button>

      </div>


    </div>


    <div id="error"></div>

  </div>


  <script type="module">


    import * as THREE from
      'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';


    import { GLTFLoader } from
      'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js';


    /*
      Temporary aircraft model

      Later we will replace this with
      the actual RSAF aircraft models.
    */

    const MODEL_URL =
      'https://raw.githubusercontent.com/amvlab/aircraft-models/main/models/A320.glb';


    /*
      HTML elements
    */

    const start =
      document.getElementById('start');

    const menu =
      document.getElementById('menu');

    const controls =
      document.getElementById('controls');

    const status =
      document.getElementById('status');

    const error =
      document.getElementById('error');

    const selectedText =
      document.getElementById('selected');

    const reticleInfo =
      document.getElementById('reticleInfo');

    const photoExit =
      document.getElementById('photoExit');


    const aircraft1 =
      document.getElementById('aircraft1');

    const aircraft2 =
      document.getElementById('aircraft2');

    const aircraft3 =
      document.getElementById('aircraft3');


    const rotateLeft =
      document.getElementById('rotateLeft');

    const rotateRight =
      document.getElementById('rotateRight');

    const smaller =
      document.getElementById('smaller');

    const larger =
      document.getElementById('larger');

    const reset =
      document.getElementById('reset');

    const photoMode =
      document.getElementById('photoMode');


    /*
      THREE.JS
    */

    const scene =
      new THREE.Scene();


    const camera =
      new THREE.PerspectiveCamera(
        70,
        window.innerWidth / window.innerHeight,
        0.01,
        100
      );


    const renderer =
      new THREE.WebGLRenderer({
        antialias: true,
        alpha: true,
        preserveDrawingBuffer: true
      });


    renderer.setPixelRatio(
      Math.min(window.devicePixelRatio, 2)
    );


    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );


    renderer.outputColorSpace =
      THREE.SRGBColorSpace;


    renderer.shadowMap.enabled =
      true;


    document.body.appendChild(
      renderer.domElement
    );


    /*
      Lights
    */

    const ambientLight =
      new THREE.HemisphereLight(
        0xffffff,
        0x444444,
        3
      );


    scene.add(
      ambientLight
    );


    const directionalLight =
      new THREE.DirectionalLight(
        0xffffff,
        3
      );


    directionalLight.position.set(
      5,
      10,
      5
    );


    directionalLight.castShadow =
      true;


    scene.add(
      directionalLight
    );


    /*
      AR variables
    */

    let xrSession = null;

    let referenceSpace = null;

    let viewerSpace = null;

    let hitTestSource = null;


    /*
      Reticle

      Shows where the aircraft
      will be placed.
    */

    const reticle =
      new THREE.Mesh(

        new THREE.RingGeometry(
          0.15,
          0.2,
          32
        ),

        new THREE.MeshBasicMaterial({
          color: 0xffffff
        })

      );


    reticle.rotation.x =
      -Math.PI / 2;


    reticle.matrixAutoUpdate =
      false;


    reticle.visible =
      false;


    scene.add(
      reticle
    );


    /*
      Aircraft storage
    */

    const aircraftObjects = [
      null,
      null,
      null
    ];


    let selectedAircraft =
      0;


    let placingAircraft =
      0;


    let aircraftTemplate =
      null;


    /*
      Load aircraft
    */

    const loader =
      new GLTFLoader();


    status.textContent =
      'Loading temporary aircraft...';


    loader.load(

      MODEL_URL,

      function(gltf) {

        aircraftTemplate =
          gltf.scene;


        /*
          Prepare model
        */

        aircraftTemplate.traverse(
          function(object) {

            if(object.isMesh){

              object.castShadow =
                true;

              object.receiveShadow =
                true;

            }

          }
        );


        status.textContent =
          '✓ AIRCRAFT MODEL READY';

      },


      undefined,

      function(err) {

        error.textContent =
          'Aircraft model failed to load.';

        console.error(err);

      }

    );


    /*
      Check AR
    */

    async function checkAR(){

      try{

        if(!navigator.xr){

          throw new Error(
            'WebXR is not available.'
          );

        }


        const supported =
          await navigator.xr.isSessionSupported(
            'immersive-ar'
          );


        if(!supported){

          throw new Error(
            'Immersive AR is not supported on this device/browser.'
          );

        }


        status.textContent =
          '✓ AR READY';


        start.disabled =
          false;


      }catch(e){

        status.textContent =
          'AR SUPPORT CHECK FAILED';

        error.textContent =
          e.message;

        start.disabled =
          true;

      }

    }


    /*
      Start AR
    */

    start.addEventListener(
      'click',
      startAR
    );


    async function startAR(){

      error.textContent =
        '';


      if(!aircraftTemplate){

        error.textContent =
          'Please wait for the aircraft model to finish loading.';

        return;

      }


      try{

        status.textContent =
          'Opening AR...';


        xrSession =
          await navigator.xr.requestSession(
            'immersive-ar',
            {
              requiredFeatures: [
                'hit-test',
                'local'
              ],

              optionalFeatures: [
                'dom-overlay'
              ],

              domOverlay: {
                root: document.body
              }

            }
          );


        /*
          Connect WebGL to WebXR
        */

        renderer.xr.enabled =
          true;


        await renderer.xr.setSession(
          xrSession
        );


        /*
          Reference spaces
        */

        referenceSpace =
          await xrSession.requestReferenceSpace(
            'local'
          );


        viewerSpace =
          await xrSession.requestReferenceSpace(
            'viewer'
          );


        /*
          Hit testing
        */

        hitTestSource =
          await xrSession.requestHitTestSource({
            space: viewerSpace
          });


        /*
          Session events
        */

        xrSession.addEventListener(
          'select',
          placeAircraft
        );


        xrSession.addEventListener(
          'end',
          endAR
        );


        /*
          Interface
        */

        start.style.display =
          'none';


        controls.style.display =
          'block';


        reticleInfo.style.display =
          'block';


        status.textContent =
          'AR ACTIVE — scan the floor';


        /*
          XR render loop
        */

        renderer.setAnimationLoop(
          renderXR
        );


      }catch(e){

        status.textContent =
          'AR FAILED';

        error.textContent =
          e.name + ': ' + e.message;

        console.error(e);

      }

    }


    /*
      Render AR
    */

    function renderXR(
      time,
      frame
    ){

      if(!frame){

        renderer.render(
          scene,
          camera
        );

        return;

      }


      const session =
        renderer.xr.getSession();


      if(
        hitTestSource &&
        referenceSpace
      ){

        const results =
          frame.getHitTestResults(
            hitTestSource
          );


        if(results.length > 0){

          const hit =
            results[0];


          const pose =
            hit.getPose(
              referenceSpace
            );


          if(pose){

            reticle.visible =
              true;


            reticle.matrix.fromArray(
              pose.transform.matrix
            );

          }

        }else{

          reticle.visible =
            false;

        }

      }


      renderer.render(
        scene,
        camera
      );

    }


    /*
      Place aircraft
    */

    function placeAircraft(){

      if(!reticle.visible){

        status.textContent =
          'Move the phone until the floor is detected.';

        return;

      }


      if(
        !aircraftTemplate
      ){

        return;

      }


      /*
        Remove old aircraft
        if this aircraft was already placed.
      */

      if(
        aircraftObjects[placingAircraft]
      ){

        scene.remove(
          aircraftObjects[placingAircraft]
        );

      }


      /*
        Clone temporary aircraft
      */

      const aircraft =
        aircraftTemplate.clone(true);


      /*
        Put aircraft at reticle
      */

      aircraft.matrix.copy(
        reticle.matrix
      );


      aircraft.matrixAutoUpdate =
        false;


      /*
        Scale

        1.0 is the temporary model scale.

        We will calibrate this to the
        actual aircraft dimensions later.
      */

      aircraft.scale.set(
        1,
        1,
        1
      );


      aircraft.matrixAutoUpdate =
        true;


      /*
        Add to scene
      */

      scene.add(
        aircraft
      );


      aircraftObjects[
        placingAircraft
      ] =
        aircraft;


      selectedAircraft =
        placingAircraft;


      updateSelectedText();


      /*
        Next aircraft
      */

      if(
        placingAircraft < 2
      ){

        placingAircraft++;

        status.textContent =
          '✓ Aircraft placed — select the next aircraft.';

      }else{

        status.textContent =
          '✓ THREE AIRCRAFT PLACED';

      }

    }


    /*
      Select aircraft 1
    */

    aircraft1.addEventListener(
      'click',
      function(){

        placingAircraft =
          0;

        selectedAircraft =
          0;

        updateSelectedText();

        status.textContent =
          'Aircraft 1 selected — tap the floor to place it.';

      }
    );


    /*
      Select aircraft 2
    */

    aircraft2.addEventListener(
      'click',
      function(){

        placingAircraft =
          1;

        selectedAircraft =
          1;

        updateSelectedText();

        status.textContent =
          'Aircraft 2 selected — tap the floor to place it.';

      }
    );


    /*
      Select aircraft 3
    */

    aircraft3.addEventListener(
      'click',
      function(){

        placingAircraft =
          2;

        selectedAircraft =
          2;

        updateSelectedText();

        status.textContent =
          'Aircraft 3 selected — tap the floor to place it.';

      }
    );


    /*
      Update selected text
    */

    function updateSelectedText(){

      selectedText.textContent =
        'Selected: Aircraft ' +
        (selectedAircraft + 1);

    }


    /*
      Get selected aircraft
    */

    function getSelectedAircraft(){

      return aircraftObjects[
        selectedAircraft
      ];

    }


    /*
      Rotate left
    */

    rotateLeft.addEventListener(
      'click',
      function(e){

        e.stopPropagation();

        const aircraft =
          getSelectedAircraft();


        if(!aircraft){

          status.textContent =
            'Place an aircraft first.';

          return;

        }


        aircraft.rotation.y -=
          THREE.MathUtils.degToRad(15);

      }
    );


    /*
      Rotate right
    */

    rotateRight.addEventListener(
      'click',
      function(e){

        e.stopPropagation();

        const aircraft =
          getSelectedAircraft();


        if(!aircraft){

          status.textContent =
            'Place an aircraft first.';

          return;

        }


        aircraft.rotation.y +=
          THREE.MathUtils.degToRad(15);

      }
    );


    /*
      Smaller
    */

    smaller.addEventListener(
      'click',
      function(e){

        e.stopPropagation();

        const aircraft =
          getSelectedAircraft();


        if(!aircraft){

          status.textContent =
            'Place an aircraft first.';

          return;

        }


        aircraft.scale.multiplyScalar(
          0.9
        );

      }
    );


    /*
      Larger
    */

    larger.addEventListener(
      'click',
      function(e){

        e.stopPropagation();

        const aircraft =
          getSelectedAircraft();


        if(!aircraft){

          status.textContent =
            'Place an aircraft first.';

          return;

        }


        aircraft.scale.multiplyScalar(
          1.1
        );

      }
    );


    /*
      Reset selected aircraft
    */

    reset.addEventListener(
      'click',
      function(e){

        e.stopPropagation();

        const aircraft =
          getSelectedAircraft();


        if(!aircraft){

          status.textContent =
            'Place an aircraft first.';

          return;

        }


        aircraft.rotation.set(
          0,
          0,
          0
        );


        aircraft.scale.set(
          1,
          1,
          1
        );


        status.textContent =
          '✓ Selected aircraft reset.';

      }
    );


    /*
      Photo mode
    */

    photoMode.addEventListener(
      'click',
      function(e){

        e.stopPropagation();

        menu.style.display =
          'none';


        reticleInfo.style.display =
          'none';


        photoExit.style.display =
          'block';

      }
    );


    /*
      Exit photo mode
    */

    photoExit.addEventListener(
      'click',
      function(e){

        e.stopPropagation();

        menu.style.display =
          'block';


        reticleInfo.style.display =
          'block';


        photoExit.style.display =
          'none';

      }
    );


    /*
      End AR
    */

    function endAR(){

      xrSession =
        null;


      hitTestSource =
        null;


      referenceSpace =
        null;


      viewerSpace =
        null;


      renderer.setAnimationLoop(
        null
      );


      reticle.visible =
        false;


      controls.style.display =
        'none';


      start.style.display =
        'inline-block';


      reticleInfo.style.display =
        'none';


      photoExit.style.display =
        'none';


      menu.style.display =
        'block';


      status.textContent =
        'AR ended. Ready to start again.';

    }


    /*
      Window resize
    */

    window.addEventListener(
      'resize',
      function(){

        camera.aspect =
          window.innerWidth /
          window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
          window.innerWidth,
          window.innerHeight
        );

      }
    );


    /*
      Start support check
    */

    checkAR();

  </script>

</body>

</html>
